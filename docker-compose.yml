services:
  mysql:
    image: mysql:8.4
    container_name: email-scheduler-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: email-scheduler-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  mysql_data:
